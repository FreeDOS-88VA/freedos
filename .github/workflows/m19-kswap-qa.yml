# SPDX-License-Identifier: GPL-2.0-or-later
name: M19 experimental VA KSSF paired source QA
on:
  push:
    branches: ['experiment/m19-kswap-va']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-source-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install standard host verification tools
        run: sudo apt-get update && sudo apt-get install -y nasm build-essential unzip
      - name: Audit public source and prepare the pinned toolchain
        run: |
          python3 -B tools/m19/verify_source_audit.py
          make m19-toolchain
      - name: Two complete normal and paired KSSF QA builds
        run: python3 -B tools/m19/qa/kswap_media.py --output build/m19-kswap-ci
      - name: Close the normal public instance and preserve clean sources
        run: |
          python3 -B tools/m19/verify_distribution.py --dist build/m19-kswap-ci/normal-dist
          test -z "$(git status --porcelain --untracked-files=all)"
