# SPDX-License-Identifier: GPL-2.0-or-later
name: M07 and M07R2 public boot-diagnosis harness

on:
  push:
    # Later milestones use their own gates and run historical regressions separately.
    branches-ignore: ['topic/m14-floppy-write-media-change', 'topic/m15-dos-api-writable-session', 'topic/m16-floppy-formats-console-input']
    paths:
      - ".github/workflows/m07-probe.yml"
      - ".gitignore"
      - "Makefile"
      - "components/fdkernel"
      - "config/m06/**"
      - "config/m07/**"
      - "docs/porting/m06-*.md"
      - "docs/porting/m07-*.md"
      - "docs/porting/m07r2-*.md"
      - "manifests/m06-components.lock.json"
      - "qa/golden/m06-kernel-manifest.json"
      - "qa/golden/m07-probe-manifest.json"
      - "qa/golden/m07r2-public-status.sha256"
      - "schema/m06-*.json"
      - "schema/m07*.json"
      - "tests/m06/**"
      - "tests/m07/**"
      - "tests/m07r2/**"
      - "tools/m01/**"
      - "tools/m02/**"
      - "tools/m03/**"
      - "tools/m04/**"
      - "tools/m05/**"
      - "tools/m06/**"
      - "tools/m07/**"
      - "tools/m07r2/**"
      - "tools/qa/**"
      - "tools/verify_scaffold.py"
  pull_request:
    paths:
      - ".github/workflows/m07-probe.yml"
      - ".gitignore"
      - "Makefile"
      - "components/fdkernel"
      - "config/m06/**"
      - "config/m07/**"
      - "docs/porting/m06-*.md"
      - "docs/porting/m07-*.md"
      - "docs/porting/m07r2-*.md"
      - "manifests/m06-components.lock.json"
      - "qa/golden/m06-kernel-manifest.json"
      - "qa/golden/m07-probe-manifest.json"
      - "qa/golden/m07r2-public-status.sha256"
      - "schema/m06-*.json"
      - "schema/m07*.json"
      - "tests/m06/**"
      - "tests/m07/**"
      - "tests/m07r2/**"
      - "tools/m01/**"
      - "tools/m02/**"
      - "tools/m03/**"
      - "tools/m04/**"
      - "tools/m05/**"
      - "tools/m06/**"
      - "tools/m07/**"
      - "tools/m07r2/**"
      - "tools/qa/**"
      - "tools/verify_scaffold.py"

jobs:
  public-probe-harness:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out parent and exact submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Assert native x64 and configure component remotes
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
          bash tools/configure_component_remotes.sh

      - name: Verify static public boundaries
        run: |
          git diff --check
          make verify-scaffold
          make m04r1-license-verify
          make m04-verify
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm
          python3 -m pip install --disable-pip-version-check -r components/fdkernel/pc88va/tests/m08-requirements.txt
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/m07-pycache" python3 -m compileall -q tools/m06 tools/m07 tools/m07r2 tests/m06 tests/m07 tests/m07r2 tools/qa
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s components/fdkernel/pc88va/tests -p 'test_*.py'

      - name: Verify the public VAEG production-trace pin is reachable
        run: |
          vaeg_verify_dir="$RUNNER_TEMP/m07r1-vaeg-public"
          git init "$vaeg_verify_dir"
          git -C "$vaeg_verify_dir" fetch --depth=1 \
            https://github.com/nakatamaho/vaeg.git \
            16ad2e0619bf4ed82a739325f7291eba4a6ed8ad
          test "$(git -C "$vaeg_verify_dir" rev-parse FETCH_HEAD)" = \
            16ad2e0619bf4ed82a739325f7291eba4a6ed8ad

      - name: Select immutable historical contract checkout
        run: |
          if test -f manifests/m08-components.lock.json; then
            git worktree add --detach "$RUNNER_TEMP/freedos-pc88va" f0edeaa35126cf6d027adac0316df5056f7b1ddb
            git -C "$RUNNER_TEMP/freedos-pc88va" submodule update --init --recursive
            (cd "$RUNNER_TEMP/freedos-pc88va" && bash tools/configure_component_remotes.sh)
            echo "HISTORICAL_ROOT=$RUNNER_TEMP/freedos-pc88va" >> "$GITHUB_ENV"
          fi

      - name: Rebuild historical M01 and M02 prerequisites
        working-directory: ${{ env.HISTORICAL_ROOT || github.workspace }}
        run: |
          make m01-host-portability
          make m01-image-identity
          make m01-preflight
          make m01-image
          M01_DIAGNOSTICS=1 make m01-build
          make m01-compare
          make m01-verify
          PYTHONDONTWRITEBYTECODE=1 python3 tools/m01/test_kernel_reproducibility.py --repo-root .
          PYTHONDONTWRITEBYTECODE=1 python3 tools/m02/test_bundle_contract.py
          make m02-preflight
          make m02-clean
          make m02-bundle
          make m02-compare
          make m02-verify

      - name: Regenerate immutable M05 and M06 prerequisites
        working-directory: ${{ env.HISTORICAL_ROOT || github.workspace }}
        run: |
          make m06-prepare-m05
          make m05-verify
          make m06

      - name: Build and verify the ROM-free M07 public harness
        working-directory: ${{ env.HISTORICAL_ROOT || github.workspace }}
        run: |
          make m07-public
          make m07r2-public

      - name: Audit the public-only result
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git -C components/fdkernel status --short --untracked-files=all)"
          test -z "$(git -C components/freecom status --short --untracked-files=all)"
          test -z "$(git -C components/country status --short --untracked-files=all)"
          echo 'M07R2 public CI verified the public VAEG pin and redacted status but did not run VAEG or inspect private firmware, disks, traces, or results.'
