# SPDX-License-Identifier: GPL-2.0-or-later
name: M18 isolated native 2HD source build

on:
  push:
    branches: ['topic/m18-memory-layout-basic-disk']
  pull_request:
    paths:
      - '.github/workflows/m18-source-build.yml'
      - '.gitmodules'
      - 'components/country'
      - 'components/edlin'
      - 'components/fdkernel'
      - 'components/freecom'
      - 'components/jwasm'
      - 'config/m18/**'
      - 'docs/porting/m18-report.md'
      - 'docs/tasks/M18-memory-layout-basic-disk-goal-Codex.md'
      - 'manifests/m18-components.lock.json'
      - 'manifests/toolchains.lock.json'
      - 'tests/m18/**'
      - 'tools/m18/**'
      - 'Makefile'
      - 'COPYING'
      - 'LICENSE.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  isolated-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Assert native x64 source-build host
        run: |
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64
      - name: Install the locked NASM host-test dependency
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260827T000000Z/ jammy main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260827T000000Z/ jammy-updates main universe' \
            'deb [check-valid-until=no] https://snapshot.ubuntu.com/ubuntu/20260827T000000Z/ jammy-security main universe' \
            | sudo tee /etc/apt/sources.list.d/m18-snapshot.list
          # Only package indexes are needed; optional command-not-found and
          # translation indexes must not gate the pinned assembler setup.
          sudo apt-get -o Acquire::Check-Valid-Until=false \
            -o Acquire::Retries=3 -o Acquire::Languages=none \
            -o Acquire::IndexTargets::deb::CNF::DefaultEnabled=false update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends nasm=2.15.05-1
          test "$(nasm -v)" = 'NASM version 2.15.05'
      - name: Run M18-local host suite and public source audit
        run: |
          make m18-host-tests
          python3 -B tools/m18/verify_source_audit.py
      - name: Build or verify the pinned Linux/amd64 Open Watcom toolchain
        run: make m18-toolchain
      - name: Build the complete disk twice from clean public source exports
        run: make m18-disk
      - name: Confirm public source checkouts remain clean
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
